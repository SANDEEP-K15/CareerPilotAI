# Local development infrastructure. Postgres is the system of record.
# Temporal is the M8 workflow server. Job providers are not composed here.

name: careerpilot

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: careerpilot
      POSTGRES_PASSWORD: careerpilot
      POSTGRES_DB: careerpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerpilot -d careerpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.27.2
    restart: unless-stopped
    ports:
      - "7233:7233"
    environment:
      DB: sqlite
      BIND_ON_IP: 0.0.0.0

volumes:
  postgres-data:
