name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: careerpilot
          POSTGRES_PASSWORD: careerpilot
          POSTGRES_DB: careerpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerpilot -d careerpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE__URL: postgresql+asyncpg://careerpilot:careerpilot@localhost:5432/careerpilot
      SECURITY__SECRET_KEY: ci-test-secret-key-not-for-production
      CAREERPILOT_RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy, strict)
        run: uv run mypy

      - name: Apply Alembic migrations
        run: uv run alembic -c database/alembic.ini upgrade head

      - name: Tests
        run: uv run pytest

      - name: Validate Docker Compose
        run: docker compose -f docker/docker-compose.yml config
